name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spr_test
          POSTGRES_PASSWORD: spr_test
          POSTGRES_DB: spr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQL_HOST: localhost
      SQL_USER: spr_test
      SQL_PASSWORD: spr_test
      SQL_DB_NAME: spr_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Apply database schema
        run: npx drizzle-kit push --force

      - name: Run tests
        run: npm test

      - name: Build (vite + esbuild server bundle)
        run: npm run build
